name: sonda de fontes (temporária)
on:
  push:
    branches: [sonda-fontes]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 sonda/guardar.py
      - uses: actions/upload-artifact@v4
        with:
          name: amostras
          path: amostras
          retention-days: 1
