name: sonda de fontes (temporária)
on:
  push:
    branches: [sonda-fontes]
    paths: ['sonda/**', '.github/workflows/sonda.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 sonda/guardar.py
      - run: |
          git config user.name sonda; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amostras && git commit -qm "amostras" && git push -q origin HEAD:sonda-fontes
